name: Render sprites

# Renders the models listed in tools/sprite_list.txt to isometric sprites and commits them to sprites/.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/sprite_list.txt
      - tools/render_sprites.gd
      - .github/workflows/sprites.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o godot.zip "$url" && unzip -tq godot.zip && break
            sleep 15
          done
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot && chmod +x godot-bin/godot
      - name: Fetch CC0 packs
        run: ./tools/fetch_packs.sh
      - name: Resolve model paths
        run: |
          : > tools/resolved.txt
          grep -v '^#' tools/sprite_list.txt | while IFS='|' read -r id pack file tiles turn; do
            id=$(echo "$id" | xargs); pack=$(echo "$pack" | xargs); file=$(echo "$file" | xargs)
            [ -z "$id" ] && continue
            src=$(find "$PWD/vendor/$pack" -type f -name "$file" | grep -v -i "/obj/" | head -1)
            [ -z "$src" ] && { echo "MISSING $id $pack $file"; continue; }
            echo "$id | $src | $(echo $tiles | xargs) | $(echo $turn | xargs)" >> tools/resolved.txt
          done
          cat tools/resolved.txt
      - name: Import project scripts
        run: ./godot-bin/godot --headless --path . --import || true
      - name: Render
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin/godot --rendering-method gl_compatibility \
            --rendering-driver opengl3 --path . res://tools/render_sprites.tscn 2>&1 | tee render.log
          echo "SHOT contact.png $(base64 -w0 ci_shots/contact.png)"
      - name: Commit sprites
        run: |
          git config user.name "Aniket"
          git config user.email "aniketpatra001@gmail.com"
          git add sprites
          git diff --cached --quiet || { git commit -q -m "Render sprites from CC0 packs" && git push -q; }
