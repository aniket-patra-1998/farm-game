name: Debug APK

# A debug build to install on a phone, for measuring on real hardware (Settings > Testing > Show performance
# numbers). Built on every push to main and on demand, and kept as the one download on the repo's front page: the
# "Latest phone build" release (tag apk-latest), replaced by each build (also the run's "farm-game-debug-apk").
# It is its own app (com.example.farmgame.debug), signed with a debug key kept in the Actions cache, so a new
# build installs over the last one; if the cache has expired, uninstall the old one first.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'tests/**']   # (nothing that changes the app)
  workflow_dispatch:

permissions:
  contents: write   # (to replace the "Latest phone build" release's APK)

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true   # only the newest push's build matters

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Download Godot and its export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          fetch() {  # url file: retried, and a broken zip counts as a failure
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-delay 5 -o "$2" "$1" && unzip -tq "$2" > /dev/null; then return 0; fi
              echo "Download attempt $attempt of $1 failed; retrying in 15 s"; rm -f "$2"; sleep 15
            done
            return 1
          }
          mkdir -p godot-bin
          fetch "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" godot.zip
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot && chmod +x godot-bin/godot
          fetch "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl && mv tpl/templates/* "$dest"/
          ls "$dest" | grep -i android

      - name: Debug signing key (kept between runs)
        id: key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: android-debug-keystore-v1

      - name: Make the debug signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOT
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Import project
        run: |
          set +e
          ./godot-bin/godot --headless --path . --import > import.log 2>&1
          code=$?
          set -e
          tail -20 import.log
          if [ "$code" -ge 128 ]; then echo "The import crashed (exit code $code)"; exit 1; fi

      - name: Gradle (for the notifications plugin)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Phone notifications (the Android build template, and the FarmNotices plugin built against it)
        run: |
          # The debug APK is a gradle export (export_presets.cfg) so it can carry our own Android plugin
          # (android/plugins/farm_notices, scripts/systems/phone_notices.gd): install the build template, then build
          # the plugin's library against the template's own Godot library and put it where the export plugin finds it.
          # (Godot's --install-android-build-template only works beside an export, and alone it stays open: the
          # template is unpacked by hand, as the editor does it: android_source.zip into android/build, and its version.)
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -rf android/build && mkdir -p android/build
          unzip -q "$tpl/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build/libs/release/ || true
          # (on Java 17, as Godot's own export: the runner's default Java is too new for gradle)
          JAVA_HOME="$JAVA_HOME_17_X64" gradle -p android/plugins/farm_notices assembleRelease --no-daemon -q
          mkdir -p addons/farm_notices/bin
          cp android/plugins/farm_notices/build/outputs/aar/farm_notices-release.aar addons/farm_notices/bin/
          ls -l addons/farm_notices/bin/

      - name: Bake the showcase farm's models into the game (ModelStore)
        run: |
          set +e
          timeout 900 ./godot-bin/godot --headless --path . res://tools/perf_probe.tscn -- --bake=${GITHUB_SHA::12} \
            > bake.log 2>&1
          set -e
          grep -E "^PERF (models|settle)" bake.log || tail -20 bake.log
          ls baked | wc -l
          test -s baked/stamp.txt

      - name: Make every item's picture ahead of time (ItemIcons, tools/bake_icons.tscn)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          set +e
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin/godot --rendering-method gl_compatibility \
            --path . res://tools/bake_icons.tscn > icons.log 2>&1
          set -e
          grep -E "^ICONS" icons.log || tail -20 icons.log
          du -sh baked

      - name: Export the debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          # Shaders compiled ahead (docs/PERF_RUN.md, win 1): the presets' shader_baker/enabled ships every shader
          # compiled, so a phone does not stall compiling one the first time it is drawn. The baker needs the editor
          # running the Mobile renderer on Vulkan (headless it is skipped without a word): a software Vulkan
          # (Mesa's lavapipe) under a virtual screen. If that export fails, the headless (unbaked) one is the build.
          sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null || true
          baked() {   # $1 preset, $2 file
            timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin/godot --rendering-driver vulkan \
              --rendering-method mobile --path . --export-debug "$1" "$2" > "$2.log" 2>&1 && code=0 || code=$?
            grep -iE "shader|vulkan|error" "$2.log" | grep -v "Storing File" | head -20 || true
            if [ "$code" != 0 ]; then echo "The baked export stopped (exit code $code)"; rm -f "$2"; return 1; fi
            test -s "$2"
          }
          plain() { ./godot-bin/godot --headless --path . --export-debug "$1" "$2" > "$2.log" 2>&1; tail -5 "$2.log"; }
          baked "Android (debug APK)" build/farm-game-debug.apk || plain "Android (debug APK)" build/farm-game-debug.apk
          test -s build/farm-game-debug.apk || { echo "No APK was made"; exit 1; }
          cp build/farm-game-debug.apk.log export.log
          ls -l build/farm-game-debug.apk
          # The benchmark build: the same game with the "benchmark" feature, which measures loading on the phone by
          # itself and quits (LoadBenchmark; phone_bench.yml runs it on real phones in Firebase Test Lab). A second,
          # unbaked one (-plain) measures what the baked shaders win: phone_bench.yml's input "apk" picks it.
          baked "Android (benchmark APK)" build/farm-game-benchmark.apk \
            || plain "Android (benchmark APK)" build/farm-game-benchmark.apk
          test -s build/farm-game-benchmark.apk || { echo "No benchmark APK was made"; exit 1; }
          plain "Android (benchmark APK)" build/farm-game-benchmark-plain.apk
          test -s build/farm-game-benchmark-plain.apk || { echo "No plain benchmark APK was made"; exit 1; }
          # What the baker added: the files the baked APK has and the plain one has not.
          unzip -Z1 build/farm-game-benchmark.apk | sort > baked.txt
          unzip -Z1 build/farm-game-benchmark-plain.apk | sort > plain.txt
          echo "Baked APK: $(stat -c %s build/farm-game-benchmark.apk) bytes, plain $(stat -c %s build/farm-game-benchmark-plain.apk);" \
            "$(comm -23 baked.txt plain.txt | wc -l) files only in the baked one:" | tee -a "$GITHUB_STEP_SUMMARY"
          comm -23 baked.txt plain.txt | sed 's#/[^/]*$##' | sort | uniq -c | head -10 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Export the Play Store bundle and measure what a phone downloads (docs/PACKS.md, Online)
        continue-on-error: true   # (a measurement: never stops the phone build)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          # The AAB leaves out the level packs' files and the showcase's baked models (export_presets.cfg); Play
          # splits it per phone (one engine, one screen density), so its own size says little: bundletool says
          # what a phone downloads. Debug-signed: the real upload key comes with the release workflow.
          ./godot-bin/godot --headless --path . --export-debug "Android (Play Store AAB)" build/farm-game.aab \
            > aab.log 2>&1 || tail -20 aab.log
          test -s build/farm-game.aab
          curl -fsSL -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar bundletool.jar build-apks --bundle=build/farm-game.aab --output=build/farm-game.apks \
            --ks=debug.keystore --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          { echo "Play bundle: $(stat -c %s build/farm-game.aab) bytes; a phone downloads (bytes, by engine):";
            java -jar bundletool.jar get-size total --apks=build/farm-game.apks --dimensions=ABI; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign the Play Store bundle with the upload key (the file to upload to Play)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.UPLOAD_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          # The owner's upload key (made 26 Nov; Google keeps the app's own signing key, Play App Signing). Play takes
          # only a higher version code each upload: this run's number, in the preset and in data/packs.json
          # (`app_code`, which the downloader compares; test 624 keeps the two agreeing), here only, never committed.
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "no upload key in the secrets: skipped"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > upload.keystore
          python3 - "${{ github.run_number }}" <<'PY'
          import re, sys
          code = sys.argv[1]
          s = open("export_presets.cfg").read()
          parts = re.split(r"(?m)^(?=\[preset\.\d+\]$)", s)
          i = next(n for n, p in enumerate(parts) if 'name="Android (Play Store AAB)"' in p)
          parts[i + 1] = re.sub(r"(?m)^version/code=\d+", "version/code=" + code, parts[i + 1])
          name = r'(?m)^version/name="([0-9]+\.[0-9]+)\.[0-9]+"'
          parts[i + 1] = re.sub(name, r'version/name="\1.' + code + '"', parts[i + 1])
          open("export_presets.cfg", "w").write("".join(parts))
          p = open("data/packs.json").read()
          open("data/packs.json", "w").write(re.sub(r'"app_code": \d+', '"app_code": ' + code, p))
          PY
          ./godot-bin/godot --headless --path . --export-release "Android (Play Store AAB)" build/barnlight.aab \
            > aab-release.log 2>&1 || tail -20 aab-release.log
          rm -f upload.keystore
          test -s build/barnlight.aab
          keytool -printcert -jarfile build/barnlight.aab | grep -m1 "Owner:"
          echo "Signed Play bundle: version code ${{ github.run_number }} (artifact barnlight-aab)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the signed Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: barnlight-aab
          path: build/barnlight.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: farm-game-debug-apk
          path: build/farm-game-debug.apk
          retention-days: 14

      - name: Replace the APK on the "Latest phone build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f apk-latest && git push -f origin refs/tags/apk-latest
          notes="Debug build of ${GITHUB_SHA::7} ($(date -u +'%F %H:%M') UTC): $(git log -1 --format=%s)"
          if gh release view apk-latest > /dev/null 2>&1; then
            gh release edit apk-latest --title "Latest phone build" --notes "$notes" --prerelease
          else
            gh release create apk-latest --title "Latest phone build" --notes "$notes" --prerelease
          fi
          gh release upload apk-latest build/farm-game-debug.apk build/farm-game-benchmark.apk \
            build/farm-game-benchmark-plain.apk --clobber
