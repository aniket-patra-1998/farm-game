name: Asset packs

# The limited animals' files and the level packs (data/level_packs.json), packed and put where the game downloads them (docs/PACKS.md): Cloudflare Pages
# project farm-game-packs (data/packs.json base_url; owner, 25 Nov: free, unlimited downloads, no domain). The
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are the owner's; nothing in the app can upload. The Limited tab's Download fetches them (owner, 20 Nov: "a
# download option in the limited tab... so that placing is seamless"). Runs when a limited animal's file or the
# packer changes on main, and by hand. A pack is named by its hash, so a new make is a new file beside the old.
on:
  push:
    branches: [main]
    paths:
      - 'art/models/**'
      - 'data/level_packs.json'
      - 'data/remote/**'
      - 'tools/make_packs.gd'
      - 'scripts/systems/asset_packs.gd'
      - '.github/workflows/packs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-packs
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o godot.zip "$url" && unzip -tq godot.zip; then
              break
            fi
            echo "Download attempt $attempt failed; retrying in 15 s"
            rm -f godot.zip
            sleep 15
          done
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot

      - name: Import project
        run: ./godot-bin/godot --headless --path . --import > import.log 2>&1 || true

      - name: Make the packs
        run: ./godot-bin/godot --headless --path . res://tools/make_packs.tscn -- --out=packs_out

      - name: Upload them to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A pack is named by its hash, so it is cached for good; the manifest only a minute, so a new make
          # reaches every phone within that.
          printf '/manifest.json\n  Cache-Control: public, max-age=60\n/tuning.json\n  Cache-Control: public, max-age=60\n/*.pck\n  Cache-Control: public, max-age=31536000, immutable\n' > packs_out/_headers
          cp data/remote/tuning.json packs_out/tuning.json   # (remote tuning: Balance.REMOTE)
          npx --yes wrangler@4 pages project create farm-game-packs --production-branch=main || true
          npx --yes wrangler@4 pages deploy packs_out --project-name=farm-game-packs --branch=main --commit-dirty=true
