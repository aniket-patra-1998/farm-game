name: Asset packs

# The limited animals' files, packed and put where the game downloads them (docs/PACKS.md): this repository's
# public release "packs" (data/packs.json base_url). The Limited tab's Download fetches them (owner, 20 Nov: "a
# download option in the limited tab... so that placing is seamless"). Runs when a limited animal's file or the
# packer changes on main, and by hand. A pack is named by its hash, so a new make is a new file beside the old.
on:
  push:
    branches: [main]
    paths:
      - 'art/models/limited/**'
      - 'tools/make_packs.gd'
      - 'scripts/systems/asset_packs.gd'
  workflow_dispatch:

permissions:
  contents: write   # it uploads to the "packs" release

concurrency:
  group: asset-packs
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o godot.zip "$url" && unzip -tq godot.zip; then
              break
            fi
            echo "Download attempt $attempt failed; retrying in 15 s"
            rm -f godot.zip
            sleep 15
          done
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot

      - name: Import project
        run: ./godot-bin/godot --headless --path . --import > import.log 2>&1 || true

      - name: Make the packs
        run: ./godot-bin/godot --headless --path . res://tools/make_packs.tscn -- --out=packs_out

      - name: Upload them to the "packs" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || gh release create packs --title "Asset packs" \
            --notes "The limited animals' files, downloaded by the game (docs/PACKS.md). Made by CI; do not edit."
          gh release upload packs packs_out/* --clobber
