name: Tests

on:
  push:
  pull_request:

jobs:
  game-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project
        # Builds Godot's class list so class_name scripts resolve when run headless.
        run: ./godot --headless --path . --import || true

      - name: Run tests
        run: ./godot --headless --path . res://tests/run_tests.tscn
