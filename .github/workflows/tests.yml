name: Tests

on:
  push:
  pull_request:

jobs:
  game-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Catalog document is up to date
        run: python3 tools/make_catalog.py --check

      # Keep the Godot binary between runs, so each push doesn't download it again.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          # -f makes HTTP errors count as failures, so the retries actually happen.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o godot.zip "$url" && unzip -tq godot.zip; then
              break
            fi
            echo "Download attempt $attempt failed; retrying in 15 s"
            rm -f godot.zip
            sleep 15
          done
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot

      - name: Import project
        # Builds Godot's class list so class_name scripts resolve when run headless.
        run: ./godot-bin/godot --headless --path . --import || true

      - name: Run tests
        run: ./godot-bin/godot --headless --path . res://tests/run_tests.tscn

      # Draws every building with a real (software) renderer, so drawing errors fail the build
      # and the pictures can be checked. Download them from the run's "screenshots" artifact.
      - name: Render building screenshots
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin/godot --rendering-method gl_compatibility \
            --rendering-driver opengl3 --resolution 1280x720 --path . res://tests/shots.tscn 2>&1 | tee shots.log
          if grep -E "SCRIPT ERROR|triangulat|Invalid polygon" shots.log; then
            echo "Drawing errors found"; exit 1
          fi
          ls ci_shots
          # Also printed into the log, for tools that can read logs but not artifacts.
          for f in ci_shots/*.png; do echo "SHOT $(basename "$f") $(base64 -w0 "$f")"; done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ci_shots/
