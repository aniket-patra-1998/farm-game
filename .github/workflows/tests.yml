name: Tests

# Runs on pushes to main and on pull requests (a branch is tested through its PR: open a draft PR for CI), not
# on every branch push as well, which ran each PR twice. A newer push to a PR cancels its older run; main keeps
# one run per push, since the code review follows each one. Docs-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read   # tests only read the repository

jobs:
  game-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Lint GDScript (gdlint)
        run: |
          pip install -q "gdtoolkit==4.*"
          gdlint autoload scripts tests tools

      - name: Catalog document and art manifest are up to date
        run: |
          python3 tools/make_catalog.py --check
          python3 tools/make_art_manifest.py --check
          python3 tools/make_notebook.py --check
          python3 tools/make_art_versions.py --check
          pip install -q numpy
          python3 tools/make_limited.py --check

      - name: Player-facing text is in locale/strings.csv
        run: python3 tools/strings_lint.py

      # Keep the Godot binary between runs, so each push doesn't download it again.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          # -f makes HTTP errors count as failures, so the retries actually happen.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o godot.zip "$url" && unzip -tq godot.zip; then
              break
            fi
            echo "Download attempt $attempt failed; retrying in 15 s"
            rm -f godot.zip
            sleep 15
          done
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot

      - name: Import project
        # Builds Godot's class list so class_name scripts resolve when run headless.
        # (The import itself may grumble about generated files; a script that doesn't compile is a failure.)
        run: |
          # The import's own exit code may be non-zero for harmless reasons, so it doesn't fail the step by
          # itself; but a crash (killed by a signal: code 128 and up) or a script that won't load does.
          set +e
          ./godot-bin/godot --headless --path . --import > import.log 2>&1
          code=$?
          set -e
          cat import.log
          if [ "$code" -ge 128 ]; then
            echo "The import crashed (exit code $code)"; exit 1
          fi
          if grep -E "Parse Error|Compile Error|Failed to load script" import.log; then
            echo "A script didn't import"; exit 1
          fi

      - name: Run tests
        run: |
          set +e
          ./godot-bin/godot --headless --path . res://tests/run_tests.tscn 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          set -e
          # A script that fails to load can let the runner exit cleanly: fail on that, and on anything but "0 failed".
          if grep -E "Parse Error|Compile Error|Failed to load script" tests.log; then echo "A script didn't load"; exit 1; fi
          grep -E "checks, 0 failed" tests.log || { echo "Tests didn't all pass"; exit 1; }
          # A crash on quit (a heap corruption at shutdown) fails too, though every test passed.
          if [ "$rc" != 0 ]; then echo "The tests passed but the engine crashed on quit (exit $rc)"; exit 1; fi
          # Any engine or script error (what the editor's Errors panel would show) fails the build too.
          python3 tools/check_godot_log.py tests.log

      # The game played as a player plays it, every frame timed (tools/session_probe: every scene of ScenePlayer on
      # a new farm, the showcase and a full farm), held to data/perf_targets.json: a stall a player would feel fails
      # the push, with what its long frames went to (owner, 22 Nov: "we keep circling back to this").
      - name: Session probe (stalls a player would feel)
        run: |
          set +e
          ./godot-bin/godot --headless --path . res://tools/session_probe.tscn -- --quality=low \
            --farms=new,showcase,filled --frames=120 --targets > session.log 2>&1 < /dev/null
          rc=$?
          set -e
          grep -E "^SESSION [a-z]+ [a-z_]+:|long frame|perf targets|PERF TARGETS|SCRIPT ERROR" session.log | cut -c1-400
          grep -q "perf targets: all met" session.log || { echo "The session probe's targets were missed"; exit 1; }
          if [ "$rc" != 0 ]; then echo "The session probe failed (exit $rc)"; exit 1; fi
