name: Phone benchmark

# Measures loading and smoothness on real Android phones in Firebase Test Lab (the cloud renders in software and
# cannot judge it). Installs the benchmark APK from the "Latest phone build" release (apk.yml makes it), lets it
# measure itself (LoadBenchmark: the showcase cold and warm, your own farm, playing), and puts each phone's report
# in this run's summary and an artifact.
# Needs once (docs/PERF_RUN.md "Phone measurements"): the secret FIREBASE_SA_KEY (a service account's JSON key with
# the Firebase Test Lab Admin and Storage Object Viewer roles) and the variable FIREBASE_PROJECT (the project id).
# The free Spark plan allows 5 physical-device runs a day: this runs nightly and by hand, two phones each time.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Devices, ';'-separated gcloud --device values (empty: the variable FTL_DEVICES or the default)"
        required: false
      apk:
        description: "Which benchmark APK of the release: farm-game-benchmark.apk (shaders baked) or farm-game-benchmark-plain.apk"
        required: false
        default: farm-game-benchmark.apk
  schedule:
    - cron: "40 20 * * *"   # 02:10 IST

concurrency:
  group: phone-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT }}
      DEVICES: ${{ github.event.inputs.devices || vars.FTL_DEVICES || 'model=a05s,version=35' }}
    steps:
      - name: Set up?
        id: ready
        env:
          KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PROJECT" ]; then
            echo "Firebase is not set up yet (secret FIREBASE_SA_KEY, variable FIREBASE_PROJECT): skipping." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The latest benchmark APK
        if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ github.event.inputs.apk }}
        run: |
          apk="${APK:-farm-game-benchmark.apk}"
          gh release download apk-latest -R "$GITHUB_REPOSITORY" -p "$apk" -O farm-game-benchmark.apk
          ls -l farm-game-benchmark.apk
          echo "APK: $apk ($(gh release view apk-latest -R "$GITHUB_REPOSITORY" --json body -q .body))" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        if: steps.ready.outputs.go == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.ready.outputs.go == 'true'

      - name: Run on real phones
        if: steps.ready.outputs.go == 'true'
        run: |
          args=()
          IFS=';' read -ra devs <<< "$DEVICES"
          for d in "${devs[@]}"; do args+=(--device "$d"); done
          # (a Robo test just launches the app; the benchmark build measures and quits by itself; its taps land on
          # the loading cover. The outcome may say "failed" when the app quits: the report is in the log.)
          # Results go to Test Lab's own bucket (free on the Spark plan); its path is read from the output.
          # (The Robo crawler stops after about a minute when it finds nothing to tap, before the benchmark has
          # measured all its phases and printed its report: the Pixel 6 ran and logged no BENCH line. The script
          # robo_wait.json only waits, thirteen minutes, so the app stays open until it has measured: the scenes
          # and the full farm (22 Nov) took the run past seven minutes, and it was cut off in the GPU sweep.)
          python3 -c 'import json; print(json.dumps([{"eventType": "DELAYED_MESSAGE_POSTED", "delayTime": 60000}] * 13))' \
            > robo_wait.json
          gcloud firebase test android run --project "$PROJECT" --type robo --app farm-game-benchmark.apk \
            --robo-script robo_wait.json "${args[@]}" --timeout 15m --no-record-video --no-performance-metrics 2>&1 | tee run.log || true
          where=$(grep -oE 'test-lab-[a-z0-9-]+/[^]/ ]+' run.log | head -1)
          bucket="gs://${where%%/*}"
          dir="${where#*/}"
          echo "## Phone benchmark ($(date -u +'%F %H:%M') UTC)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reports
          echo "Files Test Lab kept:"; gcloud storage ls -r "$bucket/$dir/" | head -60 || true
          found=0
          for log in $(gcloud storage ls "$bucket/$dir/**/logcat"); do
            name=$(echo "$log" | sed "s#$bucket/$dir/##; s#/logcat##; s#/#_#g")
            gcloud storage cat "$log" > logcat.txt
            # (Robo relaunches the app after the benchmark quits, and the relaunched app starts a new report: the
            # last BENCH line of the log was that start-only report, hiding the finished one (A05s, 19 Nov). The
            # report kept is the finished one, else the one that got furthest: the longest.)
            line=$(python3 -c '
          import json, re, sys
          best = None
          parts = {}
          for raw in open(sys.argv[1], errors="replace"):
              p = re.search(r" (\d+) +\d+ [VDIWEF] godot *: BENCH_PART ([a-z_.]+) (.*)$", raw)
              if p:
                  try:
                      key, _, sub = p.group(2).partition(".")   # ("scenes.place": one scene of the scenes)
                      into = parts.setdefault(p.group(1), {})
                      if sub:
                          into.setdefault(key, {})[sub] = json.loads(p.group(3))
                      else:
                          into[key] = json.loads(p.group(3))
                  except ValueError:
                      print("BENCH_PART %s cut short or broken" % p.group(2), file=sys.stderr)
                  continue
              m = re.search(r" (\d+) +\d+ [VDIWEF] godot *: BENCH (\{.*\})", raw)
              if not m:
                  continue
              try:
                  r = json.loads(m.group(2))
              except ValueError:
                  continue
              print("BENCH line from process %s: done=%s, %d parts (%s)" % (m.group(1), r.get("done"), len(r),
                  ", ".join(k for k in r if k not in ("device", "start"))), file=sys.stderr)
              key = (bool(r.get("done")), len(m.group(2)))
              if best is None or key >= best[0]:
                  best = (key, m.group(2), m.group(1))
          if best:
              r = json.loads(best[1])
              r.update(parts.get(best[2], {}))   # (the parts the same process told on lines of their own)
              print(json.dumps(r))
          else:
              print("")' logcat.txt)
            echo "--- $name: the app's last lines in each process that reported (how it ended: quit, crash, killed)"
            for pid in $(grep -oE ' [0-9]+ +[0-9]+ [VDIWEF] godot *: BENCH' logcat.txt | awk '{print $1}' | sort -u); do
              echo "process $pid:"; grep -E "^[0-9-]+ [0-9:.]+ +$pid " logcat.txt | tail -15 || true
              grep -E "\($pid\)|pid $pid|pid=$pid" logcat.txt | grep -iE "died|kill|signal|crash|lowmem|ANR" | tail -5 || true
            done
            echo "--- $name: the game's log lines (the last 40)"
            gcloud storage cat "$log" | grep -iE "godot|BENCH|FATAL|AndroidRuntime" | tail -40 || true
            # (why the app closed early: the A05s run of 18 Nov was closed ~4 s after the start, the Robo script's
            # wait notwithstanding. Robo's own steps, and the system's word on the app's process ending.)
            echo "--- $name: Robo's steps and the app's end"
            gcloud storage cat "$log" | grep -E " (Robo|RoboScript|Crawler|crawler)[A-Za-z]* *:" \
              | grep -vE "mControlTarget|mSystemBarColorApps|source=ActivityRecord|Window\{" | tail -60 || true
            gcloud storage cat "$log" | grep -iE "farmgame.*(died|kill|force.?stop|Force stopping|crash|ANR)|(died|kill|Force stopping).*farmgame" \
              | tail -20 || true
            echo "--- $name: what Robo did (actions.json, the start)"
            gcloud storage cat "${log%/logcat}/actions.json" 2>/dev/null | head -c 4000 || true; echo
            if [ -n "$line" ]; then
              echo "$line" > "reports/$name.json"; found=1
              echo "--- $name: the report"; echo "REPORT $line"   # (in the log too: the artifact can't always be fetched)
              printf '### %s\n```json\n%s\n```\n' "$name" "$line" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '### %s\nNo report in the log (the app may not have finished).\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for d in "${devs[@]}"; do   # why a phone was skipped: its GPU and Android level
            m=$(echo "$d" | sed 's/model=\([^,]*\).*/\1/')
            gcloud firebase test android models describe "$m" --project "$PROJECT" --format=json \
              | grep -iE '"(id|name|manufacturer|supportedAbis|perVersionInfo|form)"|vulkan|opengl|gles' | head -20 || true
          done
          echo "Physical devices available:" && gcloud firebase test android models list --project "$PROJECT" \
            --filter="form=PHYSICAL" --format="value(id,name,supportedVersionIds.list())" | head -40
          # A run that got no report from any phone is a failure, never a quiet green.
          if [ "$found" != 1 ]; then echo "::error::No phone sent a BENCH report"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: phone-bench-reports
          path: reports/
          retention-days: 30
