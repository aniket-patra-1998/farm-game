# The player APK of an earlier phone build started on an emulator again (tools/start_check.sh), without building:
# run by hand with that build's run id. docs/CRASHES.md.
name: Start check
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The Debug APK run whose player APK to start"
        required: true
      ram:
        description: "Emulator memory (a low-end phone: 3072M)"
        default: "4096M"
      api:
        description: "Android version's API level (Android 16: 36)"
        default: "36"
      build:
        description: "player (the Play build) or debug (the test app)"
        default: "player"
permissions:
  contents: read
  actions: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build == 'debug' && 'farm-game-debug-apk' || 'barnlight-player-apk' }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Let the emulator use the machine's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: google_apis
          ram-size: ${{ inputs.ram }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh tools/start_check.sh ${{ inputs.build == 'debug' && 'farm-game-debug.apk com.example.farmgame.debug' || 'barnlight-player.apk com.aniketpatra.barnlight' }} && cat start-check.txt >> "$GITHUB_STEP_SUMMARY"
