// The farm game's phone notifications as an Android library (an AAR) for Godot's gradle export.
// Built in CI (.github/workflows/apk.yml) after the Android build template is installed, against the template's
// own Godot library, so it always matches the engine; the AAR goes to addons/farm_notices/bin/.
plugins {
    id 'com.android.library' version '8.6.1'
}

android {
    namespace 'com.farmgame.notices'
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The engine's own library from the installed build template (compile against it; the game ships it).
    compileOnly fileTree(dir: '../../build/libs/release', include: ['*.aar'])
}
